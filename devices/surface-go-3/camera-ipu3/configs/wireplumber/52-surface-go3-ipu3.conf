# Surface Go 3 IPU3 + libcamera WirePlumber configuration
# Hides raw ipu3-cio2 / ipu3-imgu V4L2 nodes so apps pick clean libcamera streams,
# and sets readable descriptions and session priorities.

monitor.v4l2.rules = [
  {
    matches = [
      {
        device.name = "~v4l2_device\\.pci-0000_00_(05|14)\\.[03].*"
      }
      {
        api.v4l2.cap.driver = "~ipu3-.*"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
        node.disabled = true
      }
    }
  }
]

monitor.libcamera.rules = [
  {
    matches = [
      {
        node.name = "libcamera_input.__SB_.PCI0.I2C4.CAMF"
      }
    ]
    actions = {
      update-props = {
        node.description = "Surface Go 3 Front Camera (5MP)"
        priority.session = 900
      }
    }
  }
  {
    matches = [
      {
        node.name = "libcamera_input.__SB_.PCI0.I2C2.CAMR"
      }
    ]
    actions = {
      update-props = {
        node.description = "Surface Go 3 Rear Camera (8MP AF)"
        priority.session = 800
      }
    }
  }
  {
    matches = [
      {
        node.name = "libcamera_input.__SB_.PCI0.I2C3.CAM3"
      }
    ]
    actions = {
      update-props = {
        node.description = "Surface Go 3 IR Camera"
        priority.session = 100
      }
    }
  }
]
